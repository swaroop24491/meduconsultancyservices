filing_promise: We never miss a PF or ESI due date.

two_paths:
  heading: Two ways to work with us
  register:
    title: Get registered
    text: One-time. We register your business for PF, ESI or both.
    links:
      - { label: PF registration, path: pf-registration }
      - { label: ESI registration, path: esi-registration }
  monthly:
    title: We file every month
    text: Ongoing. Each month you send salary details and we do the filing. Already registered? We take over your filing once you share the documents we need.
    links:
      - { label: PF monthly filing, path: epf-consultancy-service }
      - { label: ESI monthly filing, path: esi-consultancy-service }
  bridge: After we register you, we can also file for you every month.
  bridge_call: Not sure which you need?

