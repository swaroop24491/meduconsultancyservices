# Home router: one choice per visitor situation. call: true adds a call row first.
situations:
  heading: What do you need help with?
  register:
    title: We need to register for PF or ESI
    text: We register your business for PF, ESI or both. After that, we can file for you every month.
    links:
      - { label: PF registration, path: pf-registration }
      - { label: ESI registration, path: esi-registration }
  monthly:
    title: We want someone to file every month
    text: Each month you send salary details and we do the filing. Already registered? Once you share the documents we need, we take over from your next due date.
    links:
      - { label: PF monthly filing, path: epf-consultancy-service }
      - { label: ESI monthly filing, path: esi-consultancy-service }
  unsure:
    title: Not sure if PF or ESI applies to us
    text: PF (savings and a pension for staff) applies with 20 or more staff. ESI (medical care and sick pay for staff) applies with 10 or more. Call us and we check for you. Asking is free. Or use our checkers.
    call: true
    links:
      - { label: Check PF, path: epf-eligibility-checker }
      - { label: Check ESI, path: esi-eligibility-checker }
  behind:
    title: We paid late or fell behind
    text: Call us and let us file on time from now on. You can also see roughly what paying late costs.
    call: true
    links:
      - { label: PF penalty calculator, path: epf-penalty-calculator }
      - { label: ESI penalty calculator, path: esi-penalty-calculator }

