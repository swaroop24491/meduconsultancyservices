      - { label: ESI ಪರಿಶೀಲಿಸಿ, path: esi-eligibility-checker }
  behind:
    title: ನಾವು ತಡವಾಗಿ ಕಟ್ಟಿದ್ದೇವೆ ಅಥವಾ ಫೈಲಿಂಗ್ ಬಾಕಿ ಇದೆ
    text: ನಮಗೆ ಕರೆ ಮಾಡಿ. ಇನ್ನು ಮುಂದೆ ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ನಾವು ಫೈಲ್ ಮಾಡುತ್ತೇವೆ. ತಡವಾಗಿ ಕಟ್ಟಿದರೆ ಸುಮಾರು ಎಷ್ಟು ಆಗುತ್ತದೆ ಎಂದೂ ನೋಡಬಹುದು.
