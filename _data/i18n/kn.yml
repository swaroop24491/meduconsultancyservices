two_paths:
  heading: ನಮ್ಮೊಂದಿಗೆ ಕೆಲಸ ಮಾಡಲು ಎರಡು ದಾರಿಗಳು
  register:
    title: ನೋಂದಣಿ ಮಾಡಿಸಿ
    text: ಒಂದು ಸಲದ ಕೆಲಸ. ನಿಮ್ಮ ವ್ಯಾಪಾರವನ್ನು PF, ESI ಅಥವಾ ಎರಡಕ್ಕೂ ನಾವು ನೋಂದಣಿ ಮಾಡುತ್ತೇವೆ.
    links:
      - { label: PF ನೋಂದಣಿ, path: pf-registration }
      - { label: ESI ನೋಂದಣಿ, path: esi-registration }
  monthly:
    title: ಪ್ರತಿ ತಿಂಗಳು ನಾವು ಫೈಲ್ ಮಾಡುತ್ತೇವೆ
    text: ಪ್ರತಿ ತಿಂಗಳು ನಡೆಯುವ ಸೇವೆ. ನೀವು ಸಂಬಳದ ವಿವರ ಕಳುಹಿಸಿ, ಫೈಲಿಂಗ್ ನಾವು ಮಾಡುತ್ತೇವೆ. ಈಗಾಗಲೇ ನೋಂದಣಿ ಆಗಿದೆಯೇ? ನಮಗೆ ಬೇಕಾದ ದಾಖಲೆಗಳನ್ನು ನೀವು ಕಳುಹಿಸಿದ ನಂತರ, ನಿಮ್ಮ ಫೈಲಿಂಗ್ ಅನ್ನು ನಾವು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇವೆ.
    links:
      - { label: PF ಮಾಸಿಕ ಫೈಲಿಂಗ್, path: epf-consultancy-service }
      - { label: ESI ಮಾಸಿಕ ಫೈಲಿಂಗ್, path: esi-consultancy-service }
  bridge: ನೋಂದಣಿಯ ನಂತರ ಪ್ರತಿ ತಿಂಗಳ ಫೈಲಿಂಗ್ ಕೂಡ ನಾವು ಮಾಡಬಹುದು.
  bridge_call: ನಿಮಗೆ ಯಾವುದು ಬೇಕು ಎಂದು ಗೊತ್ತಿಲ್ಲವೇ?

how_we_work:
  heading: ನಾವು ಕೆಲಸ ಮಾಡುವ ರೀತಿ
  steps:
    - { title: ನಮಗೆ ಕರೆ ಮಾಡಿ., text: ನಿಮ್ಮ ವ್ಯಾಪಾರಕ್ಕೆ PF ಮತ್ತು ESI ಅನ್ವಯಿಸುತ್ತದೆಯೇ ಎಂದು ನಾವು ನೋಡುತ್ತೇವೆ. }
    - { title: ಯಾವ ದಾಖಲೆಗಳು ಬೇಕು ಎಂದು ನಾವು ಹೇಳುತ್ತೇವೆ., text: ನೀವು ಅವುಗಳನ್ನು ಕಳುಹಿಸಿ. }
    - { title: ನಿಮ್ಮ ವ್ಯಾಪಾರ ಮತ್ತು ಸಿಬ್ಬಂದಿಯ ಖಾತೆಗಳನ್ನು ನಾವು ಸಿದ್ಧಮಾಡುತ್ತೇವೆ., text: "PF ಅಥವಾ ESI ನಿಮಗೆ ಹೊಸದೇ? ಮೊದಲು ನಾವು ನೋಂದಣಿ ಮಾಡುತ್ತೇವೆ." }
    - { title: "ಪ್ರತಿ ತಿಂಗಳು ನೀವು ಸಂಬಳದ ವಿವರ ಕಳುಹಿಸಿ,", text: ನಾವು ಫೈಲ್ ಮಾಡುತ್ತೇವೆ. }
    - { title: ಫೈಲ್ ಮಾಡಿದ ರಸೀದಿ ಮತ್ತು ಚಲನ್‌ಗಳನ್ನು ನಿಮಗೆ ಇಮೇಲ್ ಮಾಡುತ್ತೇವೆ, text: (ಪಾವತಿ ಚೀಟಿಗಳು). }
  # Home only (how-we-work.html short=true): 3 steps, no filing promise
  short_heading: ಇದು ಹೇಗೆ ನಡೆಯುತ್ತದೆ
  short_steps:
    - { title: ನಮಗೆ ಕರೆ ಮಾಡಿ., text: ನಿಮ್ಮ ವ್ಯಾಪಾರಕ್ಕೆ PF ಮತ್ತು ESI ಅನ್ವಯಿಸುತ್ತದೆಯೇ ಎಂದು ನಾವು ನೋಡುತ್ತೇವೆ. ಕೇಳುವುದು ಉಚಿತ. }
    - { title: ನಾವು ಕೇಳುವ ದಾಖಲೆಗಳನ್ನು ಕಳುಹಿಸಿ., text: "ನೋಂದಣಿ ಆಗಿಲ್ಲದಿದ್ದರೆ, ನಿಮ್ಮ ವ್ಯಾಪಾರವನ್ನು ನಾವು ನೋಂದಣಿ ಮಾಡುತ್ತೇವೆ. ಈಗಾಗಲೇ ನೋಂದಣಿ ಆಗಿದೆಯೇ? ನಿಮ್ಮ ಫೈಲಿಂಗ್ ಅನ್ನು ನಾವು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇವೆ." }
    - { title: ಪ್ರತಿ ತಿಂಗಳು ಸಂಬಳದ ವಿವರ ಕಳುಹಿಸಿ., text: "ನಾವು ಫೈಲ್ ಮಾಡಿ, ರಸೀದಿ ಮತ್ತು ಚಲನ್‌ಗಳನ್ನು (ಪಾವತಿ ಚೀಟಿಗಳು) ನಿಮಗೆ ಇಮೇಲ್ ಮಾಡುತ್ತೇವೆ." }

