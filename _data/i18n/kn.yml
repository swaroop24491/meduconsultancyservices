    text: 20 ಅಥವಾ ಹೆಚ್ಚು ಸಿಬ್ಬಂದಿ ಇದ್ದರೆ PF (ಸಿಬ್ಬಂದಿಗೆ ಉಳಿತಾಯ ಮತ್ತು ಪಿಂಚಣಿ) ಅನ್ವಯಿಸುತ್ತದೆ. 10 ಅಥವಾ ಹೆಚ್ಚು ಸಿಬ್ಬಂದಿ ಇದ್ದರೆ ESI (ಸಿಬ್ಬಂದಿಗೆ ವೈದ್ಯಕೀಯ ಚಿಕಿತ್ಸೆ ಮತ್ತು ಅನಾರೋಗ್ಯದ ಸಮಯದಲ್ಲಿ ಹಣದ ಸಹಾಯ) ಅನ್ವಯಿಸುತ್ತದೆ. ನಮಗೆ ಕರೆ ಮಾಡಿ, ನಾವು ನೋಡಿ ಹೇಳುತ್ತೇವೆ. ಕೇಳುವುದು ಉಚಿತ. ಅಥವಾ ನಮ್ಮ ಪರಿಶೀಲನೆ ಸಾಧನಗಳನ್ನು ಬಳಸಿ.
