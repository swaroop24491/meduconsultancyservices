  items:
    - { word: 35 ವರ್ಷ, title: ನಮ್ಮ ಸ್ಥಾಪಕರು EPFOನಲ್ಲಿ 35 ವರ್ಷ ಕೆಲಸ ಮಾಡಿದ್ದರು, text: "ಮೆದು ತಿರುಮಲೇಶ್ವರ ಭಟ್ ಅವರು 2000ರಲ್ಲಿ ಮೆದು ಕನ್ಸಲ್ಟೆನ್ಸಿ ಆರಂಭಿಸಿದರು. ಅವರು EPFOನಲ್ಲಿ (PF ಇಲಾಖೆ) 35 ವರ್ಷ ಕೆಲಸ ಮಾಡಿದ್ದರು. PF ನಿಯಮಗಳನ್ನು ಅವರು ನಮಗೆ ಕಲಿಸಿದರು." }
    - { word: ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ, title: ನಾವು PF ಅಥವಾ ESI ಕೊನೆಯ ದಿನಾಂಕವನ್ನು ಎಂದೂ ತಪ್ಪಿಸುವುದಿಲ್ಲ., text: "ಪ್ರತಿ ತಿಂಗಳ ಸಂಬಳದ PF ಮತ್ತು ESI ಅನ್ನು ಮುಂದಿನ ತಿಂಗಳ 15ನೇ ತಾರೀಖಿನೊಳಗೆ ಕಟ್ಟಬೇಕು. ಪ್ರತಿ ಗ್ರಾಹಕರಿಗೂ ಈ ದಿನಾಂಕಗಳನ್ನು ನಾವು ಗಮನಿಸುತ್ತೇವೆ." }
    - { word: 3 ಭಾಷೆಗಳು, title: "ಇಂಗ್ಲಿಷ್, ಕನ್ನಡ ಅಥವಾ ಹಿಂದಿಯಲ್ಲಿ ಮಾತನಾಡಿ", text: "ನೀವು ನಮ್ಮೊಂದಿಗೆ ಇಂಗ್ಲಿಷ್ ಅಥವಾ ಕನ್ನಡದಲ್ಲಿ ಮಾತನಾಡಬಹುದು. ಹಿಂದಿಯಲ್ಲೂ ನಾವು ಸಹಾಯ ಮಾಡುತ್ತೇವೆ. ನಮ್ಮ ವೆಬ್‌ಸೈಟ್ ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಕನ್ನಡದಲ್ಲಿದೆ." }

