{%- comment -%} The 3 city pages in one line. include city-links.html {%- endcomment -%}
{%- include i18n.html -%}
<p class="inline-links"><span>{{ t.cities_label }}</span>
  {%- for l in t.footer.places_links %}
  {% include resolve-link.html path=l.path %}<a href="{{ href }}"{% if link_en %} hreflang="en"{% endif %}>{{ l.label }}{% if link_en %}<span class="link-lang"> {{ t.english_marker }}</span>{% endif %}</a>
  {%- endfor %}
</p>
